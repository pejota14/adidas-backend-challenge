plugins {
    id 'java'
    id "net.serenity-bdd.serenity-gradle-plugin"
}

group = 'org.adidas.frontend'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${property('junit.version')}"
    testImplementation "org.junit.platform:junit-platform-suite:${property('junit.version')}"
    testImplementation "io.rest-assured:rest-assured:${property('restAssured.version')}"
    implementation "org.json:json:${property('json.version')}"
    implementation "io.cucumber:cucumber-junit-platform-engine:${property('cucumber.version')}"
    implementation "net.serenity-bdd:serenity-core:${property('serenity.version')}"
    testImplementation "net.serenity-bdd:serenity-junit:${property('serenity.version')}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${property('serenity.version')}"
}

test {
    useJUnitPlatform()
    finalizedBy aggregate
}